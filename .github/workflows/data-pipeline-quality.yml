name: Data Pipeline Quality

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      # experiments/ est linté depuis qu'il est versionné (cf. .gitignore).
      # v5/ est traité à part : 11 défauts connus et non corrigés (F632 x9,
      # F821, E711), listés dans docs/ARCHITECTURE.md § Dettes connues.
      - name: Lint
        run: |
          python -m ruff check src scripts tests experiments

      - name: Lint v5 (non bloquant — dettes connues)
        continue-on-error: true
        run: |
          python -m ruff check v5

      - name: Unit tests
        run: |
          python -m pytest tests/unit -q

      - name: Integration tests (determinism)
        run: |
          python -m pytest tests/integration -q

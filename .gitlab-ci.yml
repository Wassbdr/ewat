# EWAT — CI GitLab (équivalent du workflow GitHub data-pipeline-quality).
# Lint ruff (non bloquant : warnings visibles, le pipeline ne casse pas dessus) +
# tests unitaires et d'intégration (bloquants).
stages:
  - quality

default:
  image: python:3.12-slim
  before_script:
    - python -m pip install --upgrade pip
    - pip install -e .[dev]

lint:
  stage: quality
  script:
    - python -m ruff check src scripts tests
  allow_failure: true   # lint informatif — géré manuellement, ne bloque pas la CI

unit-tests:
  stage: quality
  script:
    - python -m pytest tests/unit -q

integration-tests:
  stage: quality
  script:
    - python -m pytest tests/integration -q

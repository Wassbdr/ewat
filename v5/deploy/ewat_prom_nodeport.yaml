# NodePort vers kube-prometheus (monitoring/monitoring-kube-prometheus-prometheus).
#
# Pourquoi : le NodePort historique :32700 (monitoring-metrics/prometheus-server)
# scrape cAdvisor VIA le proxy API-server→kubelet (job kubernetes-nodes-cadvisor),
# qui renvoie 503 sur ce cluster (proxy :10250 cassé, ~14-16 juin 2026). Résultat :
# 0 série container_* pour tt/tt-b → prom=0 → raw-gate FAIL → collecte v5 en pause.
#
# kube-prometheus, lui, scrape le kubelet DIRECTEMENT (sans le proxy cassé) et voit
# bien tt/tt-b (64 séries cpu/ram chacun). Mais il n'a que du ClusterIP. Ce Service
# l'expose en NodePort :32702 pour que la collecte (probe.py, V5_PROM_NODEPORT)
# l'atteigne depuis la VM.
#
# Usage : kubectl apply -f v5/deploy/ewat_prom_nodeport.yaml
#         puis lancer la collecte avec V5_PROM_NODEPORT=32702
apiVersion: v1
kind: Service
metadata:
  name: ewat-prom-np
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: ewat
    ewat.devoteam/purpose: v5-collection-prometheus-access
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
    operator.prometheus.io/name: monitoring-kube-prometheus-prometheus
  ports:
    - name: http-web
      port: 9090
      targetPort: 9090
      nodePort: 32702
      protocol: TCP
